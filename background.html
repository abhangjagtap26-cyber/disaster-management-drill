<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Particles Background</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0b091a; }
    #particles-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>

  <div id="particles-container"></div>

  <script type="module">
    import { Renderer, Camera, Geometry, Program, Mesh } from 'https://cdn.jsdelivr.net/npm/ogl@1.0.11/+esm';

    const defaultColors = ['#ffffff', '#818cf8', '#38bdf8'];

    const hexToRgb = hex => {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const int = parseInt(hex.slice(0, 6), 16);
      return [((int >> 16) & 255) / 255, ((int >> 8) & 255) / 255, (int & 255) / 255];
    };

    const vertex = /* glsl */ `
      attribute vec3 position;
      attribute vec4 random;
      attribute vec3 color;
      uniform mat4 modelMatrix;
      uniform mat4 viewMatrix;
      uniform mat4 projectionMatrix;
      uniform float uTime;
      uniform float uSpread;
      uniform float uBaseSize;
      uniform float uSizeRandomness;
      varying vec4 vRandom;
      varying vec3 vColor;
      void main() {
        vRandom = random;
        vColor = color;
        vec3 pos = position * uSpread;
        pos.z *= 10.0;
        vec4 mPos = modelMatrix * vec4(pos, 1.0);
        float t = uTime;
        mPos.x += sin(t * random.z + 6.28 * random.w) * mix(0.1, 1.5, random.x);
        mPos.y += sin(t * random.y + 6.28 * random.x) * mix(0.1, 1.5, random.w);
        mPos.z += sin(t * random.w + 6.28 * random.y) * mix(0.1, 1.5, random.z);
        vec4 mvPos = viewMatrix * mPos;
        if (uSizeRandomness == 0.0) {
          gl_PointSize = uBaseSize;
        } else {
          gl_PointSize = (uBaseSize * (1.0 + uSizeRandomness * (random.x - 0.5))) / length(mvPos.xyz);
        }
        gl_Position = projectionMatrix * mvPos;
      }
    `;

    const fragment = /* glsl */ `
      precision highp float;
      uniform float uTime;
      uniform float uAlphaParticles;
      varying vec4 vRandom;
      varying vec3 vColor;
      void main() {
        vec2 uv = gl_PointCoord.xy;
        float d = length(uv - vec2(0.5));
        if(uAlphaParticles < 0.5) {
          if(d > 0.5) discard;
          gl_FragColor = vec4(vColor + 0.2 * sin(uv.yxx + uTime + vRandom.y * 6.28), 1.0);
        } else {
          float circle = smoothstep(0.5, 0.4, d) * 0.8;
          gl_FragColor = vec4(vColor + 0.2 * sin(uv.yxx + uTime + vRandom.y * 6.28), circle);
        }
      }
    `;

    const container = document.getElementById('particles-container');
    const mouse = { x: 0, y: 0 };

    const renderer = new Renderer({ dpr: Math.min(window.devicePixelRatio || 1, 2), depth: false, alpha: true });
    const gl = renderer.gl;
    container.appendChild(gl.canvas);
    gl.clearColor(0, 0, 0, 0);

    const camera = new Camera(gl, { fov: 15 });
    camera.position.set(0, 0, 20);

    const resize = () => {
      renderer.setSize(container.clientWidth, container.clientHeight);
      camera.perspective({ aspect: gl.canvas.width / gl.canvas.height });
    };
    window.addEventListener('resize', resize);
    resize();

    // Catch mouse messages sent from main.html across the iframe
    window.addEventListener('message', e => {
      if (e.data && e.data.type === 'MOUSE_MOVE') {
        mouse.x = (e.data.x / e.data.w) * 2 - 1;
        mouse.y = -(e.data.y / e.data.h) * 2 + 1;
      }
    });

    // Fallback mouse listener if background.html is opened standalone
    window.addEventListener('mousemove', e => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    const count = 300;
    const positions = new Float32Array(count * 3);
    const randoms = new Float32Array(count * 4);
    const colors = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      let x, y, z, len;
      do {
        x = Math.random() * 2 - 1;
        y = Math.random() * 2 - 1;
        z = Math.random() * 2 - 1;
        len = x * x + y * y + z * z;
      } while (len > 1 || len === 0);
      const r = Math.cbrt(Math.random());
      positions.set([x * r, y * r, z * r], i * 3);
      randoms.set([Math.random(), Math.random(), Math.random(), Math.random()], i * 4);
      colors.set(hexToRgb(defaultColors[Math.floor(Math.random() * defaultColors.length)]), i * 3);
    }

    const geometry = new Geometry(gl, {
      position: { size: 3, data: positions },
      random: { size: 4, data: randoms },
      color: { size: 3, data: colors }
    });

    const program = new Program(gl, {
      vertex, fragment,
      uniforms: {
        uTime: { value: 0 },
        uSpread: { value: 10 },
        uBaseSize: { value: 100 * Math.min(window.devicePixelRatio || 1, 2) },
        uSizeRandomness: { value: 1 },
        uAlphaParticles: { value: 1 }
      },
      transparent: true, depthTest: false
    });

    const particles = new Mesh(gl, { mode: gl.POINTS, geometry, program });
    let lastTime = performance.now();
    let elapsed = 0;

    const update = t => {
      requestAnimationFrame(update);
      const delta = t - lastTime;
      lastTime = t;
      elapsed += delta * 0.1;

      program.uniforms.uTime.value = elapsed * 0.001;
      particles.position.x = -mouse.x;
      particles.position.y = -mouse.y;
      particles.rotation.x = Math.sin(elapsed * 0.0002) * 0.1;
      particles.rotation.y = Math.cos(elapsed * 0.0005) * 0.15;
      particles.rotation.z += 0.001;

      renderer.render({ scene: particles, camera });
    };

    requestAnimationFrame(update);
  </script>
</body>
</html>
